    # --- Customer Enquiry Schemas ---
    CreateEnquiryRequest:
      type: object
      required:
        - enquiryType
        - customer
        - message
      properties:
        enquiryType:
          type: string
          enum: [GENERAL, VEHICLE_AVAILABILITY, PRICE_QUOTE, FINANCE_ASSISTANCE, TRADE_IN]
          example: "FINANCE_ASSISTANCE"
        customer:
          $ref: '#/components/schemas/CustomerContact'
        vehicleReference:
          $ref: '#/components/schemas/VehicleReference'
        preferredTimeSlot:
          type: string
          enum: [MORNING, AFTERNOON, EVENING, ANYTIME]
          default: ANYTIME
          example: "AFTERNOON"
        postalCode:
          type: string
          example: "90210"
        message:
          type: string
          example: "I am interested in financing the 2026 GT Coupe and would like to know available low-APR incentives."

    CustomerContact:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - preferredContactMethod
      properties:
        firstName:
          type: string
          example: "Sophia"
        lastName:
          type: string
          example: "Reynolds"
        email:
          type: string
          format: email
          example: "sophia.reynolds@example.com"
        phone:
          type: string
          example: "+1-555-738-9901"
        preferredContactMethod:
          type: string
          enum: [EMAIL, PHONE, WHATSAPP, SMS]
          default: EMAIL
          example: "EMAIL"

    VehicleReference:
      type: object
      properties:
        vehicleId:
          type: string
          example: "VEL-2026-GT"
        make:
          type: string
          example: "Mercedes-AMG"
        model:
          type: string
          example: "GT Coupe"
        year:
          type: integer
          example: 2026

    EnquiryResponse:
      type: object
      required:
        - enquiryId
        - referenceTicket
        - status
        - createdAt
      properties:
        enquiryId:
          type: string
          example: "enq_993412"
        referenceTicket:
          type: string
          example: "VEL-ENQ-8821"
        status:
          type: string
          enum: [NEW, ASSIGNED, IN_PROGRESS, RESOLVED, CANCELLED]
          example: "NEW"
        createdAt:
          type: string
          format: date-time

    EnquiryDetail:
      type: object
      required:
        - enquiryId
        - referenceTicket
        - enquiryType
        - status
