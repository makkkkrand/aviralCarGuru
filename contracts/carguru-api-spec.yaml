        - message
        - createdAt
      properties:
        enquiryId:
          type: string
        referenceTicket:
          type: string
        enquiryType:
          type: string
        status:
          type: string
        customer:
          $ref: '#/components/schemas/CustomerContact'
        vehicleReference:
          $ref: '#/components/schemas/VehicleReference'
        preferredTimeSlot:
          type: string
        postalCode:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EnquiryCategoriesResponse:
