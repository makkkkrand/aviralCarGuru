            type: string
          example: ["GENERAL", "VEHICLE_AVAILABILITY", "PRICE_QUOTE", "FINANCE_ASSISTANCE", "TRADE_IN"]
        contactMethods:
          type: array
          items:
            type: string
          example: ["EMAIL", "PHONE", "WHATSAPP", "SMS"]
        timeSlots:
