          items:
            $ref: '#/components/schemas/DocumentItem'
        statusHistory:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistoryItem'

    DocumentItem:
      type: object
      required:
        - documentType
        - status
      properties:
        documentId:
          type: string
        documentType:
          type: string
          enum: [GOVERNMENT_ID, PAY_SLIP, BANK_STATEMENT, PROOF_OF_RESIDENCE]
