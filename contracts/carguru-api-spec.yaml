        - referenceNumber
        - status
        - submittedAt
        - applicant
        - vehicleDetails
        - loanTerms
        - requiredDocuments
        - statusHistory
      properties:
        applicationId:
          type: string
        referenceNumber:
          type: string
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, APPROVED, CONDITIONAL_APPROVAL, NEEDS_DOCUMENTS, REJECTED]
        submittedAt:
          type: string
          format: date-time
        applicant:
          $ref: '#/components/schemas/ApplicantPersonalDetails'
        employment:
