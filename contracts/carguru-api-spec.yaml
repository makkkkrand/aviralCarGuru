          type: string
          example: "app_6745ef92a81c"
        referenceNumber:
          type: string
          example: "VEL-APP-2026-0941"
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, APPROVED, CONDITIONAL_APPROVAL, NEEDS_DOCUMENTS, REJECTED]
