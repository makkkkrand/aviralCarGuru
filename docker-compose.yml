version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: carguru-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carguru_db
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: carguru-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: carguru_db
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carguru-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  mongo-data:
